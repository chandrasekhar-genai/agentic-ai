[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-pr-review-agent"
version = "0.1.0"
description = "AI-assisted Terraform pull request review: landing-zone guardrails, Checkov, Infracost and an LLM write-up."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
azure = ["openai>=1.40", "azure-identity>=1.16"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tfreview = "tfreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
