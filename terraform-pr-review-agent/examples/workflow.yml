# Copy to .github/workflows/terraform-review.yml in your infrastructure repo.
name: terraform-review

on:
  pull_request:
    paths: ["infra/**"]

permissions:
  id-token: write        # Azure OIDC for plan and the model
  contents: read
  pull-requests: write   # post the review comment

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Plan
        working-directory: infra
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > ../plan.json

      - name: Checkov
        run: pipx run checkov -d infra --framework terraform -o json --soft-fail > checkov.json

      - name: Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - run: |
          infracost breakdown --path plan.json --format json --out-file base.json
          infracost diff --path plan.json --compare-to base.json --format json --out-file infracost.json

      - uses: chandrasekhar-genai/agentic-ai/terraform-pr-review-agent@main
        with:
          plan-json: plan.json
          checkov-json: checkov.json
          infracost-json: infracost.json
          llm: azure
          fail-on: high
