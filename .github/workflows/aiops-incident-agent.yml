name: aiops-incident-agent

on:
  push:
    branches: [main]
    paths: ["aiops-incident-agent/**", ".github/workflows/aiops-incident-agent.yml"]
  pull_request:
    paths: ["aiops-incident-agent/**", ".github/workflows/aiops-incident-agent.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: aiops-incident-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Offline demo (no cluster, no LLM key)
        run: make demo

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/aiops-agent
      - run: helm template t deploy/helm/aiops-agent --set rbac.namespaces={shop,payments} > /dev/null

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: aiops-incident-agent
          load: true
          tags: aiops-incident-agent:${{ github.sha }}
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aiops-incident-agent:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${{ github.repository_owner }}/aiops-incident-agent
          docker tag aiops-incident-agent:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag aiops-incident-agent:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
