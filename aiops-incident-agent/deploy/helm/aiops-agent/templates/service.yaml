apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-agent.name" . }}
  labels:
    {{- include "aiops-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aiops-agent.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aiops-agent.name" . }}
  labels:
    {{- include "aiops-agent.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
