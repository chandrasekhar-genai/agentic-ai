[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-finops-agent"
version = "0.1.0"
description = "Azure FinOps agent: cost anomalies, optimisation findings and reviewable Terraform fixes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
azure = ["openai>=1.40", "azure-identity>=1.16"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
finops-agent = "finops_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"examples/*" = ["S311"]
